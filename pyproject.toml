[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messages-api-lint"
version = "0.1.0"
description = "A static linter for stale Claude Messages API usage in Python and TypeScript."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
messages-api-lint = "messages_api_lint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/messages_api_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
